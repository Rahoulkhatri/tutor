<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages - TutorConnect</title>
    <!-- Updated CSS path to work with local server -->
    <link rel="stylesheet" href="/css/chat.css">
</head>
<body>
    <div class="chat-container">
        <!-- Sidebar - Conversations -->
        <div class="chat-sidebar">
            <div class="chat-header">
                <h2>Messages</h2>
                <button class="new-chat">+</button>
            </div>
            <div class="conversations-list" id="conversations-list">
                <p class="empty-state" id="conversations-empty">Loading…</p>
            </div>
        </div>

        <!-- Main Chat Area -->
        <div class="chat-main">
            <div class="chat-header-main">
                <div class="chat-header-left">
                    <a href="#" class="chat-back" onclick="history.back(); return false;" title="Back">← Back</a>
                    <div class="chat-contact" id="chat-contact-header">
                        <div class="avatar" id="chat-header-avatar">—</div>
                        <div>
                            <h3 id="chat-header-name">Select a conversation</h3>
                            <p id="chat-header-subtitle">—</p>
                        </div>
                    </div>
                </div>
                <div class="chat-actions">
                    <button>📞</button>
                    <button>📹</button>
                    <button>ℹ️</button>
                </div>
            </div>

            <div class="messages-area" id="chat-messages-area">
                <p class="empty-state" id="messages-empty">Select a conversation or open chat from Dashboard (Start Class / Join).</p>
            </div>

            <div class="message-input">
                <input type="text" id="chat-input" placeholder="Type your message..." autocomplete="off">
                <button type="button" class="btn-attach" title="Attach file">📎</button>
                <button type="button" class="btn-emoji" title="Emoji">😊</button>
                <button type="button" class="btn-send" title="Send">📤</button>
            </div>
        </div>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/chat.js"></script>
</body>
</html>
