<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Tutors - TutorConnect</title>
    <link rel="stylesheet" href="/css/search.css">
</head>
<body>
    <div class="container">
        <!-- Left sidebar -->
        <aside class="sidebar">
            <div class="logo">TutorConnect</div>
            <ul class="sidebar-menu">
                <li><a href="/student-dashboard.html">Dashboard</a></li>
                <li><a href="/search-tutors.html" class="active">Search Tutors</a></li>
                <li><a href="/chat.html">Messages</a></li>
                <li><a href="/payments.html">Payments</a></li>
            </ul>
        </aside>

        <!-- Main content -->
        <main class="main-content">
            <section class="search-header">
                <h1>Find Your Perfect Tutor</h1>
                <p>Browse real teaching offers from active tutors. Filter by subject, price and location, then send a request or message for questions.</p>
            </section>

            <!-- Filters -->
            <section class="filters-section">
                <div class="filter-group">
                    <label for="subjectFilter">Subject / Course</label>
                    <input id="subjectFilter" type="text" placeholder="e.g. Mathematics, Physics, SAT" />
                </div>
                <div class="filter-group">
                    <label for="locationFilter">Location</label>
                    <input id="locationFilter" type="text" placeholder="e.g. Gulshan, Defence" />
                </div>
                <div class="filter-group">
                    <label for="priceFilter">Max hourly rate (Rs.)</label>
                    <input id="priceFilter" type="range" min="1000" max="4000" step="200" value="4000" />
                    <span id="priceValue">Up to Rs. 4,000/hour</span>
                </div>
                <div class="filter-group">
                    <label for="ratingFilter">Minimum rating</label>
                    <select id="ratingFilter">
                        <option value="">Any</option>
                        <option value="4.0">4.0+</option>
                        <option value="4.5">4.5+</option>
                    </select>
                </div>
                <button class="btn-filter" type="button" onclick="applyFilters()">Apply Filters</button>
            </section>

            <!-- Dynamic tutor results -->
            <section class="tutors-list" id="tutors-list">
                <p>Loading tutors...</p>
            </section>
        </main>
    </div>

    <script src="/js/dashboard-auth.js"></script>
    <script src="/js/search.js"></script>
</body>
</html>
